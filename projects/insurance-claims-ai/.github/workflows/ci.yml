name: insurance-claims-ai-ci

on:
  push:
    paths:
      - 'projects/insurance-claims-ai/**'
  pull_request:
    paths:
      - 'projects/insurance-claims-ai/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/insurance-claims-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python benchmark.py
